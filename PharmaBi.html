:root{--bg:#f2f7f6;--card:#fff;--tx:#10302b;--mu:#58726d;--ac:#0f766e;--on:#fff;--bd:#d6e5e2;--hd:#0f766e12;--sh:0 1px 2px #0b2b2610,0 6px 20px #0b2b2610;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}

.logo{font-weight:700;color:var(--ac);font-size:1.2rem;display:flex;align-items:center;gap:8px}.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--ac);color:var(--on);font-style:normal}
.card,.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh);animation:up .4s both}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}.brand{position:relative;overflow:hidden;padding:48px;background:linear-gradient(135deg,#0b5d57,#0f766e 55%,#14a090);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:14px}
.brand h2{font-size:2rem;margin:0}.brand p{opacity:.9;max-width:34ch}.cap{position:absolute;width:150px;height:56px;border-radius:99px;background:linear-gradient(90deg,#ffffff30 50%,#ffffff14 50%);transform:rotate(var(--r))}
.pane{display:grid;place-items:center;padding:24px;position:relative}.pane .prefs{position:absolute;inset-block-start:14px;inset-inline-end:14px}
.login{width:min(400px,100%);display:grid;gap:8px;position:relative;z-index:2}
.auth{position:relative;overflow:hidden}.brand h2,.brand p,.brand .logo{position:relative;z-index:2}.pane .prefs{z-index:3}
.rain{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.pl{position:absolute;top:-90px;display:block;line-height:1;animation:fall linear infinite;will-change:transform;filter:drop-shadow(0 4px 5px #0003)}
.pl.cap{width:calc(46px*var(--s));height:calc(18px*var(--s));border-radius:99px;background:linear-gradient(90deg,#14b8a6 50%,#f8fffe 50%);border:1px solid #0f766e77}
.pl.dot{width:calc(24px*var(--s));height:calc(24px*var(--s));border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#5eead4 60%,#0f9488)}
.pl.cross{font-size:calc(22px*var(--s));color:#10b981}

.pw{position:relative}.pw input{padding-inline-end:44px}.eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--mu);padding:6px;display:grid;border-radius:8px;transition:color .2s,background .2s}.eye:hover,.eye:focus-visible{color:var(--ac);background:var(--hd);outline:0}.eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.login p.d{color:var(--mu);margin:0 0 6px;font-size:.9rem}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);transition:border-color .2s,box-shadow .2s}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--hd)}
.err{color:#dc2626;margin:0;min-height:1.3em;font-size:.9rem}.pv{font-size:.78rem;color:var(--mu);margin:8px 0 0}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:9px;padding:9px 15px;cursor:pointer;font-weight:600;transition:filter .15s,transform .15s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.45;cursor:default}

nav{display:grid;gap:3px;margin-top:18px}.nav{text-align:start;background:none;border:0;border-radius:9px;padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;transition:background .2s,padding .2s}.nav:hover{background:var(--hd);padding-inline-start:16px}.nav.on{background:var(--ac);color:var(--on)}.nav b{background:#dc2626;color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem}
