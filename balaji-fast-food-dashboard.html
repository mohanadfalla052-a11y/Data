--bgfx:radial-gradient(900px 520px at 100% 108%,rgba(255,110,20,.22),transparent 60%),radial-gradient(700px 420px at -5% -8%,rgba(170,24,24,.28),transparent 60%);
--p0:#c98500;--p1:#9085e9;--p2:#e66767;--p3:#3987e5;--p4:#d95926;--p5:#199e70;--p6:#d55181;--na:#7d6d66;--k0:#ff7a1a;--k1:#3987e5;
--glass:rgba(24,9,10,.72)}
:root[data-theme=light]{
--bg:#f7f0e9;--card:#ffffff;--card2:#fff6ee;--solid:#ffffff;--border:rgba(90,40,15,.13);
--ink:#2a0f0b;--ink2:#5c3d34;--muted:#86695f;--accent:#e2560c;--accent2:#f0a020;--accent-ink:#ffffff;--atext:#b9440a;
--good:#0c7a38;--bad:#c4261b;--grid:rgba(90,40,15,.09);--shadow:0 10px 28px rgba(110,50,20,.12);--tip:#2a0f0b;
--bgfx:radial-gradient(800px 480px at 100% -10%,rgba(255,150,60,.22),transparent 60%),radial-gradient(700px 420px at -5% 110%,rgba(220,60,40,.12),transparent 60%);
--p0:#eda100;--p1:#4a3aa7;--p2:#e34948;--p3:#2a78d6;--p4:#eb6834;--p5:#1baf7a;--p6:#e87ba4;--na:#a8958d;--k0:#e2560c;--k1:#2a78d6;
--glass:rgba(255,255,255,.82)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.5;transition:background .35s,color .35s}
body::before{content:"";position:fixed;inset:0;background:var(--bgfx);z-index:-1;pointer-events:none}
[dir=rtl] body{letter-spacing:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* shell */
.side{position:fixed;inset-block:0;inset-inline-start:0;width:var(--sbw);padding:18px 14px;display:flex;flex-direction:column;gap:6px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-inline-end:1px solid var(--border);z-index:30;transition:width .3s cubic-bezier(.3,.8,.3,1)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px;min-height:62px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--accent2),var(--accent) 55%,#c62d1a);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,100,20,.4);flex:none}
.logo svg{width:24px;height:24px}
.brand b{font-family:var(--f-disp);font-size:23px;line-height:1;font-weight:800;letter-spacing:.2px;white-space:nowrap;display:block}
[dir=rtl] .brand b{font-family:var(--f-body);font-size:19px;font-weight:800}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:500;white-space:nowrap;transition:background .2s,color .2s,transform .2s}
.nav a:hover{background:var(--card2);color:var(--ink);transform:translateX(2px)}
[dir=rtl] .nav a:hover{transform:translateX(-2px)}
.nav a.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 24%,transparent),transparent);color:var(--ink);font-weight:700}
.nav a.on::before{content:"";position:absolute;inset-inline-start:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--accent);box-shadow:0 0 14px var(--accent)}
[dir=rtl] .nav a.on{background:linear-gradient(270deg,color-mix(in srgb,var(--accent) 24%,transparent),transparent)}
[dir=rtl] .nav a.on::before{border-radius:4px 0 0 4px}
.nav a.on svg{color:var(--atext)}
.side .grow{flex:1}
.side .foot{display:flex;flex-direction:column;gap:8px}
.collapse-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);white-space:nowrap}
.collapse-btn:hover{background:var(--card2);color:var(--ink)}
.collapsed{--sbw:78px}
.collapsed .lbl,.collapsed .brand div{display:none}
.collapsed .brand{justify-content:center;padding-inline:0}
.collapsed .nav a,.collapsed .collapse-btn{justify-content:center;padding-inline:0}
.collapsed .nav a.on::before{inset-inline-start:-14px}
[dir=rtl] .collapse-btn svg{transform:scaleX(-1)}
.collapsed .collapse-btn svg{transform:scaleX(-1)}
.collapsed[dir=rtl] .collapse-btn svg,[dir=rtl] .collapsed .collapse-btn svg{transform:none}
.main{margin-inline-start:var(--sbw);transition:margin .3s cubic-bezier(.3,.8,.3,1);min-width:0}
.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:14px;padding:12px 28px;flex-wrap:wrap}
.top h1{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1.05;letter-spacing:.2px}
[dir=rtl] .top h1{font-family:var(--f-body);font-size:24px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px}
.top .tt{min-width:0;margin-inline-end:auto}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 12px;height:40px;width:230px;color:var(--muted);transition:border-color .2s,box-shadow .2s}
.sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.sbox input{background:none;border:0;outline:0;flex:1;min-width:0;color:var(--ink)}
.ib{height:40px;min-width:40px;padding:0 11px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;transition:transform .15s,background .2s,border-color .2s}
.ib:hover{background:var(--card2);border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.ib:active{transform:scale(.94)}
.ib.spin svg{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.pop-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:40;min-width:240px;background:var(--solid);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:10px;animation:popin .16s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.pop h4{font-size:12.5px;color:var(--muted);font-weight:600;margin:4px 6px 8px}
.pop select{width:100%;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);padding:0 10px}
.pop p{font-size:12px;color:var(--muted);margin:8px 6px 2px}
/* filters */
.fbar{padding:0 28px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbar .ftoggle{display:none}
.fset{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dt{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:11px;background:var(--card);font-size:13px;color:var(--muted)}
.dt input{background:none;border:0;outline:0;color:var(--ink);font-size:13px;width:124px;color-scheme:dark}
[data-theme=light] .dt input{color-scheme:light}
.ms{position:relative}
.ms>button{height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;transition:.2s}
.ms>button:hover{background:var(--card2)}
.ms>button.act{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.ms>button .n{background:var(--accent);color:var(--accent-ink);border-radius:20px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.ms svg.i{width:15px;height:15px}
.ms .pop{inset-inline-end:auto;inset-inline-start:0;max-height:320px;overflow:auto;min-width:210px}
.opt{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;font-size:13.5px}
.opt:hover{background:var(--card2)}
.opt input{accent-color:var(--accent);width:16px;height:16px}
.opt i{width:9px;height:9px;border-radius:3px;flex:none}
.opt em{margin-inline-start:auto;font-style:normal;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 28px 12px;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:20px;padding:3px 6px 3px 11px;font-size:12.5px;animation:popin .2s}
[dir=rtl] .chip{padding:3px 11px 3px 6px}
.chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.chip button:hover{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.chip svg.i{width:12px;height:12px}
.link{color:var(--atext);font-weight:600;font-size:13px;padding:6px 8px;border-radius:8px}
.link:hover{background:var(--card2)}
/* content */
.content{padding:22px 28px 60px;max-width:1500px;margin-inline:auto}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(8px);min-width:0;transition:transform .25s,border-color .25s,background .3s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.card-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px 0}
.card-h h3{font-size:15.5px;font-weight:700}
.card-h p{color:var(--muted);font-size:12.5px;margin-top:1px}
.card-b{padding:14px 20px 20px}
.stagger>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.page{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0}}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;min-height:230px;display:flex;align-items:flex-end;padding:30px 32px;color:#fff3ea;--gdir:right;
background:linear-gradient(to var(--gdir),rgba(14,4,5,.94) 8%,rgba(14,4,5,.62) 48%,rgba(14,4,5,.08) 100%),var(--hero-img) 72% 40%/cover;border:1px solid rgba(255,170,100,.25);box-shadow:var(--shadow)}
[dir=rtl] .hero{--gdir:left;background-position:28% 40%}
.hero h2{font-family:var(--f-disp);font-size:clamp(40px,6vw,68px);line-height:.95;font-weight:800;letter-spacing:.5px;text-transform:none}
[dir=rtl] .hero h2{font-family:var(--f-body);font-size:clamp(34px,5vw,54px);line-height:1.15}
.hero p{max-width:520px;margin-top:10px;color:#e8cfc2;font-size:14.5px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,200,160,.28);backdrop-filter:blur(6px);border-radius:20px;padding:4px 12px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pill svg.i{width:14px;height:14px;color:var(--accent2)}
.ember{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffb02e;box-shadow:0 0 10px 3px rgba(255,140,30,.7);bottom:-10px;animation:float 6s linear infinite;opacity:0}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-260px) translateX(20px);opacity:0}}
/* kpi */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(5,1fr);margin-block:16px}
.kpi{padding:16px 16px 14px;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-4px)}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 17%,transparent);color:var(--atext);margin-bottom:12px;transition:transform .3s}
.kpi:hover .ic{transform:rotate(-8deg) scale(1.1)}
.kpi .l{color:var(--ink2);font-size:12.5px;font-weight:600}
.kpi .v{font-family:var(--f-disp);font-size:34px;font-weight:700;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
[dir=rtl] .kpi .v{font-family:var(--f-body);font-size:28px;font-weight:800}
.kpi .v.txt{font-size:24px;display:flex;align-items:center;gap:8px}
[dir=rtl] .kpi .v.txt{font-size:21px}
.kpi .h{color:var(--muted);font-size:12px;margin-top:3px;min-height:18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tr{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:12px;padding:1px 7px;border-radius:20px}
.tr svg.i{width:12px;height:12px;stroke-width:2.4}
.tr.up{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.tr.dn{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
/* charts */
.chart{direction:ltr;position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.gl{stroke:var(--grid)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1s ease-out forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.areafade{animation:fade .9s .2s both}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:8px;font-size:12.5px;color:var(--ink2)}
.legend i,.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.vb{position:relative;display:flex;padding-inline-start:44px;height:var(--h,240px);direction:inherit}
.vb .y{position:absolute;inset-inline:0;height:0;border-top:1px solid var(--grid);display:flex}
.vb .y span{position:absolute;inset-inline-start:0;top:-8px;width:38px;font-size:11px;color:var(--muted);text-align:end;direction:ltr}
.vb .cols{position:relative;display:flex;flex:1;gap:8px;align-items:stretch;min-width:0}
.vb .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;position:relative;cursor:default}
.vb .bw{width:100%;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;flex:1;position:relative}
.vb .b{width:100%;border-radius:6px 6px 0 0;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both;transition:filter .2s,opacity .2s;min-height:2px}
.vb .c:hover .b{filter:brightness(1.18)}
.vb .cols:hover .c:not(:hover) .b{opacity:.55}
.vb .val{font-size:11.5px;font-weight:700;margin-bottom:4px;white-space:nowrap;direction:ltr}
.vb .x{position:absolute;top:100%;margin-top:7px;font-size:11px;color:var(--ink2);text-align:center;width:100%;line-height:1.2;word-break:normal;overflow-wrap:normal;hyphens:none}
.vbwrap{overflow-x:auto;padding:14px 0 4px}
@keyframes grow{from{transform:scaleY(0)}}
.hb{display:grid;grid-template-columns:minmax(78px,130px) 1fr auto;gap:10px;align-items:center;padding:7px 0;cursor:default}
.hb .n{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;min-width:0}
.hb .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .n i{width:10px;height:10px;border-radius:3px;flex:none}
.hb .t{height:10px;border-radius:6px;background:var(--grid);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:6px;width:var(--w);animation:wgrow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*50ms)}
@keyframes wgrow{from{width:0}}
.hb .v{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px;text-align:end}
.hb:hover .t i{filter:brightness(1.2)}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.donut .dw{position:relative;width:170px;height:170px;flex:none;direction:ltr}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle.seg{fill:none;stroke-width:13;transition:stroke-width .2s,opacity .2s;animation:dfade .8s both}
@keyframes dfade{from{stroke-dasharray:0 100}}
.donut svg:hover circle.seg{opacity:.5}
.donut svg circle.seg:hover{opacity:1;stroke-width:16}
.donut .ct{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .ct b{font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1}
[dir=rtl] .donut .ct b{font-family:var(--f-body);font-size:19px}
.donut .ct small{color:var(--muted);font-size:11.5px}
.dl{display:flex;flex-direction:column;gap:7px;min-width:150px;flex:1}
.dl div{display:flex;align-items:center;gap:8px;font-size:13px}
.dl b{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.dl em{font-style:normal;color:var(--muted);font-size:12px;min-width:44px;text-align:end}
.seg-c{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.seg-c button{padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:.2s}
.seg-c button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 40%,transparent)}
.seg-c button:not(.on):hover{background:var(--card2)}
/* heatmap */
.hm{display:grid;gap:5px;direction:inherit;overflow-x:auto}
.hm .cell{border-radius:9px;min-height:44px;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;transition:transform .15s,box-shadow .2s;cursor:default;animation:rise .4s both;animation-delay:calc(var(--k,0)*12ms)}
.hm .cell:hover{transform:scale(1.07);box-shadow:0 0 0 2px var(--ink2);z-index:2}
.hm .cell.pk{box-shadow:0 0 0 2px var(--accent2)}
.hm .hd{font-size:11.5px;color:var(--ink2);display:grid;place-items:center;text-align:center;font-weight:600;padding:2px}
.hm .rh{place-items:center start}
.ramp{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.ramp i{flex:0 1 160px;height:8px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 8%,transparent),var(--accent))}
[dir=rtl] .ramp i{transform:scaleX(-1)}
/* ranking */
.podium{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.rk{padding:18px;position:relative;overflow:hidden}
.rk .no{position:absolute;inset-inline-end:14px;top:6px;font-family:var(--f-disp);font-size:78px;font-weight:800;line-height:1;color:var(--ink);opacity:.07}
.rk .nm{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px}
.rk .nm i{width:12px;height:12px;border-radius:4px}
.rk .rv{font-family:var(--f-disp);font-size:32px;font-weight:700;margin:10px 0 2px}
[dir=rtl] .rk .rv{font-family:var(--f-body);font-size:26px;font-weight:800}
.rk small{color:var(--muted)}
.pbar{height:7px;border-radius:5px;background:var(--grid);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;width:var(--w);border-radius:5px;animation:wgrow .9s cubic-bezier(.2,.8,.2,1) both}
.badge{display:inline-block;padding:1px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--atext);white-space:nowrap}
.badge.low{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.badge.gray{background:var(--grid);color:var(--ink2)}
/* table */
.tw{overflow-x:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;text-align:start;font-size:12px;font-weight:700;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--solid);user-select:none}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
th .ar{display:inline-block;margin-inline-start:4px;color:var(--atext)}
td{padding:10px 12px;border-bottom:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{transition:background .15s}

function parseCSV(text){const out=[];let r=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c=='"'){if(text[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&text[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')out.push(r);r=[]}else f+=c}
if(f!==''||r.length){r.push(f);out.push(r)}return out}
function loadData(){
  const raw=document.getElementById('raw-csv').textContent.trim();
  const recs=parseCSV(raw);const head=recs.shift().map(h=>h.trim());const ix=Object.fromEntries(head.map((h,i)=>[h,i]));
  const dq={rows:recs.length,invalid:0,dupRows:0,dupIds:0,missingPay:0,slash:0,dash:0,mismatch:0};
  const seen=new Set(),ids=new Set(),rows=[];
  for(const r of recs){
    const key=r.join('\u0001');if(seen.has(key)){dq.dupRows++;continue}seen.add(key);
    const m=/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/.exec((r[ix.date]||'').trim());
    const price=Number(r[ix.item_price]),qty=Number(r[ix.quantity]),amt=Number(r[ix.transaction_amount]),id=Number(r[ix.order_id]);
    let ts=null;if(m){const mo=+m[1],d=+m[2],y=+m[3];const dt=new Date(Date.UTC(y,mo-1,d));if(mo>=1&&mo<=12&&dt.getUTCMonth()==mo-1&&dt.getUTCDate()==d)ts=dt.getTime()}
    if(ts==null||[price,qty,amt,id].some(Number.isNaN)||!r[ix.item_name]){dq.invalid++;continue}
    if(/\//.test(r[ix.date]))dq.slash++;else dq.dash++;
    if(ids.has(id))dq.dupIds++;ids.add(id);
    if(Math.abs(price*qty-amt)>1e-9)dq.mismatch++;
    const pay=(r[ix.transaction_type]||'').trim()||null;if(!pay)dq.missingPay++;
    const dt=new Date(ts);const dow=(dt.getUTCDay()+6)%7;
    const wk=ts-dow*864e5;
    rows.push({id,ts,iso:dt.toISOString().slice(0,10),ym:dt.getUTCFullYear()*100+dt.getUTCMonth()+1,mts:Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),1),dow,wk,
      item:r[ix.item_name].trim(),type:r[ix.item_type].trim(),price,qty,amt,pay,payL:pay||'Unspecified',recv:r[ix.received_by].trim(),tod:r[ix.time_of_sale].trim()});
  }
  rows.sort((a,b)=>a.ts-b.ts||a.id-b.id);
  dq.min=rows[0].ts;dq.max=rows[rows.length-1].ts;dq.days=new Set(rows.map(r=>r.ts)).size;dq.span=Math.round((dq.max-dq.min)/864e5)+1;
  const uniq=(k,ord)=>{const s=[...new Set(rows.map(r=>r[k]))];return ord?s.sort((a,b)=>ord.indexOf(a)-ord.indexOf(b)):s.sort()};
  const facets={item:uniq('item'),type:uniq('type'),pay:uniq('payL',['Cash','Online','Unspecified']),recv:uniq('recv'),tod:uniq('tod',TOD)};
  return{rows,dq,facets};
}

const FKEY={item:'item',type:'type',pay:'payL',recv:'recv',tod:'tod'};
function filterRows(all,f){
  const sets=Object.fromEntries(Object.keys(FKEY).map(k=>[k,f[k].length?new Set(f[k]):null]));
  return all.filter(r=>{if(f.from&&r.iso<f.from)return false;if(f.to&&r.iso>f.to)return false;for(const k in FKEY){if(sets[k]&&!sets[k].has(r[FKEY[k]]))return false}return true});
}
const _memo=new WeakMap();
const M=(rows,name,fn)=>{let o=_memo.get(rows);if(!o){o={};_memo.set(rows,o)}return name in o?o[name]:(o[name]=fn(rows))};

  const h1=rows.filter(r=>r.ts<mid),h2=rows.filter(r=>r.ts>=mid);if(!h1.length||!h2.length)return null;
  const s=x=>{const rev=sumBy(x,'amt'),n=x.length;return{rev,orders:n,qty:sumBy(x,'qty'),aov:rev/n}};return{a:s(h1),b:s(h2)};
}
function kpis(rows){return M(rows,'kpi',rows=>{
  const rev=sumBy(rows,'amt'),orders=rows.length,qty=sumBy(rows,'qty');

  const h=halves(rows);
  return{rev,orders,qty,aov:orders?rev/orders:0,avgPrice:orders?sumBy(rows,'price')/orders:0,products:prods.length,cats:cats.length,best:prods[0],bestCat:cats[0],prods,catsAgg:cats,
    h,tr:h?{rev:chg(h.a.rev,h.b.rev),orders:chg(h.a.orders,h.b.orders),qty:chg(h.a.qty,h.b.qty),aov:chg(h.a.aov,h.b.aov)}:null}})}
const monthly=rows=>M(rows,'mon',rows=>group(rows,r=>r.mts).sort((a,b)=>a.key-b.key));
const byDow=rows=>M(rows,'dow',rows=>{const g=group(rows,r=>r.dow);return DOW.map(d=>g.find(x=>x.key===d)||{key:d,rev:0,qty:0,orders:0})});
const byTod=rows=>M(rows,'tod',rows=>{const g=group(rows,r=>r.tod);return TOD.filter(x=>g.some(y=>y.key===x)).map(x=>g.find(y=>y.key===x))});
const byDay=rows=>M(rows,'day',rows=>group(rows,r=>r.ts).sort((a,b)=>a.key-b.key));
const byWeek=rows=>M(rows,'wk',rows=>group(rows,r=>r.wk).sort((a,b)=>a.key-b.key));
function heat(rows){return M(rows,'heat',rows=>{const m={};for(const r of rows){const k=r.dow+'|'+r.tod;(m[k]??={rev:0,orders:0,qty:0});m[k].rev+=r.amt;m[k].orders++;m[k].qty+=r.qty}return m})}
function dist(rows){const bins=[];const step=100;const mx=rows.reduce((a,r)=>Math.max(a,r.amt),0);const n=Math.max(1,Math.ceil((mx+1)/step));for(let i=0;i<n;i++)bins.push({lo:i*step,hi:i*step+step-1,c:0});for(const r of rows)bins[Math.floor(r.amt/step)].c++;return bins}
const colorOf=(dim,v)=>{if(dim==='item')return`var(--p${D.facets.item.indexOf(v)%7})`;if(dim==='type')return v==='Fastfood'?'var(--k0)':'var(--k1)';
  if(dim==='pay')return{Cash:'var(--p0)',Online:'var(--p3)'}[v]||'var(--na)';if(dim==='recv')return v==='Mr.'?'var(--p4)':'var(--p1)';return'var(--accent)'};

/* ============================================================
   5. CHART PRIMITIVES (SVG / HTML, no libraries)
   ============================================================ */
const tip=$('#tip');
function showTip(html,x,y){tip.innerHTML=html;tip.classList.add('on');const w=tip.offsetWidth,h=tip.offsetHeight;let l=x+14,tp=y+14;if(l+w>innerWidth-8)l=x-w-14;if(tp+h>innerHeight-8)tp=y-h-14;tip.style.left=Math.max(6,l)+'px';tip.style.top=Math.max(6,tp)+'px'}
const hideTip=()=>tip.classList.remove('on');
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el.dataset.tip,e.clientX,e.clientY);else if(!e.target.closest||!e.target.closest('.hit'))hideTip()});
document.addEventListener('pointerleave',hideTip);
document.addEventListener('scroll',hideTip,true);
const tipRow=(c,l,v)=>`<div><i style="background:${c}"></i>${l}: <b style="display:inline">${v}</b></div>`;
const tipA=h=>esc(h);   // tooltips are put in attributes → escape
const niceMax=v=>{if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e};

/* area / line chart with time-scaled x axis */
let _gid=0;
function lineChart(el,{series,fmtV,fmtT,area=true,height=280}){
  const W=Math.max(260,el.clientWidth),H=height,m={l:46,r:14,t:12,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=series.flatMap(s=>s.pts);if(!all.length){el.innerHTML='';return}
  const x0=Math.min(...all.map(p=>p.t)),x1=Math.max(...all.map(p=>p.t));
  const ym=niceMax(Math.max(...all.map(p=>p.v))*1.04);
  const X=tm=>m.l+(x1===x0?iw/2:(tm-x0)/(x1-x0)*iw),Y=v=>m.t+ih-v/ym*ih;
  const id='g'+(++_gid);let g='';
  for(let i=0;i<=4;i++){const v=ym/4*i,y=Y(v);g+=`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text class="ax" x="${m.l-8}" y="${y+4}" text-anchor="end">${cf(v)}</text>`}
  const nt=Math.min(6,Math.max(2,Math.floor(iw/90)));
  for(let i=0;i<nt;i++){const tm=x0+(x1-x0)*(nt===1?0:i/(nt-1));g+=`<text class="ax" x="${X(tm)}" y="${H-6}" text-anchor="${i==0?'start':i==nt-1?'end':'middle'}">${fmtT(tm)}</text>`}
  let defs='';
  series.forEach((s,si)=>{
    const d=s.pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)).join('');
    if(area&&series.length===1){defs+=`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".38"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
      g+=`<path class="areafade" d="${d}L${X(s.pts.at(-1).t)} ${Y(0)}L${X(s.pts[0].t)} ${Y(0)}Z" fill="url(#${id})"/>`}
    g+=`<path class="draw" pathLength="1" d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.pts.length<=40)g+=s.pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.6" fill="${s.color}" stroke="var(--solid)" stroke-width="2"/>`).join('');
  });
  g+=`<line id="${id}x" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/><g id="${id}d"></g><rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  el.innerHTML=(series.length>1?`<div class="legend">${series.map(s=>`<span><i class="sw" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`:'')+`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"><defs>${defs}</defs>${g}</svg>`;
  const svg=el.querySelector('svg'),hit=svg.querySelector('.hit'),xl=svg.querySelector('#'+id+'x'),dots=svg.querySelector('#'+id+'d');
  hit.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();const mx=(e.clientX-r.left)*(W/r.width);const tm=x0+(mx-m.l)/iw*(x1-x0);
    const near=s=>s.pts.reduce((b,p)=>Math.abs(p.t-tm)<Math.abs(b.t-tm)?p:b);
    const p0=near(series[0]);xl.setAttribute('x1',X(p0.t));xl.setAttribute('x2',X(p0.t));xl.setAttribute('opacity',1);
    dots.innerHTML=series.map(s=>{const p=near(s);return`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="5.5" fill="${s.color}" stroke="var(--solid)" stroke-width="2.5"/>`}).join('');
    showTip(`<b>${p0.label||fmtT(p0.t)}</b>`+series.map(s=>{const p=near(s);return tipRow(s.color,s.name,fmtV(p.v))}).join(''),e.clientX,e.clientY)});
  hit.addEventListener('pointerleave',()=>{xl.setAttribute('opacity',0);dots.innerHTML='';hideTip()});
}

/* vertical bars (HTML) */
function vbars(el,items,{fmtV,height=240,max}){
  const mx=niceMax(max??Math.max(...items.map(i=>i.v),1)*1.02);
  const grid=[0,1,2,3,4].map(i=>`<div class="y" style="bottom:${i*25}%"><span>${cf(mx/4*i)}</span></div>`).join('');
  const cols=items.map((it,k)=>`<div class="c" data-tip="${tipA(`<b>${it.label}</b>${tipRow(it.color,it.name||'',fmtV(it.v))}${it.extra||''}`)}"><div class="bw"><div class="val">${it.v?fmtV(it.v,true):''}</div><div class="b" style="height:${Math.max(0,it.v/mx*100)}%;background:${it.color};animation-delay:${k*45}ms"></div></div><div class="x">${it.label}</div></div>`).join('');
  el.innerHTML=`<div class="vbwrap"><div class="vb" style="--h:${height}px;margin-bottom:38px;min-width:${items.length*56+44}px">${grid}<div class="cols">${cols}</div></div></div>`;
}
/* horizontal bars (HTML) */
function hbars(el,items,{fmtV,total}){
  const mx=Math.max(...items.map(i=>i.v),1);
  el.innerHTML=items.map((it,k)=>`<div class="hb" style="--k:${k}" data-tip="${tipA(`<b>${it.label}</b>${tipRow(it.color,it.tl||'',fmtV(it.v))}${total?`<div>${t('share')}: <b style="display:inline">${pf(it.v/total)}</b></div>`:''}`)}"><div class="n"><i style="background:${it.color}"></i><span>${it.label}</span></div><div class="t"><i style="--w:${it.v/mx*100}%;background:${it.color}"></i></div><div class="v">${fmtV(it.v)}${total?` <small style="color:var(--muted);font-weight:500">${pf(it.v/total,0)}</small>`:''}</div></div>`).join('');
}
/* donut */
function donut(el,items,{fmtV,centerL,centerV}){
  const tot=items.reduce((a,i)=>a+i.v,0)||1;let off=0;const R=40,C=2*Math.PI*R;
  const segs=items.map((it,k)=>{const f=it.v/tot,len=f*C;const s=`<circle class="seg" cx="50" cy="50" r="${R}" stroke="${it.color}" stroke-dasharray="${Math.max(0,len-(items.length>1?1.6:0))} ${C}" stroke-dashoffset="${-off}" style="animation-delay:${k*120}ms" data-tip="${tipA(`<b>${it.label}</b>${tipRow(it.color,'',fmtV(it.v))}<div>${t('share')}: <b style="display:inline">${pf(f)}</b></div>`)}"/>`;off+=len;return s}).join('');
  el.innerHTML=`<div class="donut"><div class="dw"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--grid)" stroke-width="13"/>${segs}</svg><div class="ct"><b>${centerV}</b><small>${centerL}</small></div></div><div class="dl">${items.map(it=>`<div><i class="sw" style="background:${it.color}"></i><span>${it.label}</span><b>${fmtV(it.v)}</b><em>${pf(it.v/tot)}</em></div>`).join('')}</div></div>`;
}
const seg=(name,opts,cur)=>`<div class="seg-c" role="group">${opts.map(([v,l])=>`<button data-seg="${name}" data-v="${v}" class="${cur===v?'on':''}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
const card=o=>`<section class="card ${o.cls||''}" style="--i:${o.i||0}">${o.title?`<header class="card-h"><div><h3>${o.title}</h3>${o.sub?`<p>${o.sub}</p>`:''}</div>${o.act||''}</header>`:''}<div class="card-b">${o.body}</div></section>`;
const metricFmt=m=>m==='rev'?(v,c)=>c?cf(v):money(v):(v,c)=>c?cf(v):nf(v);
const metricName=m=>m==='rev'?t('m_rev'):m==='orders'?t('m_orders'):t('m_qty');

  add('categories','i_cat',t('x_cat',{c:lv(K.bestCat.key),rev:money(K.bestCat.rev),share:pf(K.bestCat.rev/tot)}));
  const mon=[...monthly(rows)].sort((a,b)=>b.rev-a.rev);if(mon.length>1)add('cal','i_month',t('x_month',{m:mLong(mon[0].key),rev:money(mon[0].rev),m2:mLong(mon.at(-1).key),rev2:money(mon.at(-1).rev)}));
  const dw=byDow(rows).filter(g=>g.orders).sort((a,b)=>b.rev-a.rev);if(dw.length>1)add('time','i_dow',t('x_dow',{d:dowName(dw[0].key),rev:money(dw[0].rev),d2:dowName(dw.at(-1).key),rev2:money(dw.at(-1).rev)}));
  const td=[...byTod(rows)].sort((a,b)=>b.rev-a.rev);add('clock','i_tod',t('x_tod',{t:todL(td[0].key),orders:nf(td[0].orders),rev:money(td[0].rev),share:pf(td[0].rev/tot)}));
  const pay=group(rows,r=>r.payL);const g=k=>pay.find(x=>x.key===k)?.rev||0,known=g('Cash')+g('Online'),un=pay.find(x=>x.key==='Unspecified');
  if(known>0)add('cash','i_pay',t('x_pay',{c:pf(g('Cash')/known),o:pf(g('Online')/known),u:nf(un?.orders||0),us:pf((un?.orders||0)/K.orders)}));
  if(P.length>3)add('bars','i_conc',t('x_conc',{share:pf(P.slice(0,3).reduce((a,x)=>a+x.rev,0)/tot),n:nf(P.length-3),rest:pf(P.slice(3).reduce((a,x)=>a+x.rev,0)/tot)}));
  if(K.h&&K.tr.rev!=null)add('sales','i_growth',t(K.tr.rev>=0?'x_growth_up':'x_growth_dn',{r1:money(K.h.a.rev),r2:money(K.h.b.rev),chg:spf(K.tr.rev)}));
  const mo=rows.reduce((b,r)=>r.amt>b.amt?r:b,rows[0]);add('bag','i_max',t('x_max',{amt:money(mo.amt),qty:nf(mo.qty),p:lv(mo.item),date:dFull(mo.ts),id:nf(mo.id)}));
  const bd=[...byDay(rows)].sort((a,b)=>b.rev-a.rev)[0];add('star','i_day',t('x_day',{date:dFull(bd.key),rev:money(bd.rev),orders:nf(bd.orders)}));

  if(P.length>2){const unit=new Map();rows.forEach(r=>unit.set(r.item,r.price));const hp=[...unit].sort((a,b)=>b[1]-a[1])[0];if(hp&&[...unit.values()].some(v=>v!==hp[1]))add('tag','i_price',t('x_price',{p:lv(hp[0]),price:money(hp[1]),rr:nf(P.findIndex(x=>x.key===hp[0])+1),rq:nf(pq.findIndex(x=>x.key===hp[0])+1)}));}
  return out}
function slots(rows){const H=heat(rows),tods=TOD.filter(x=>rows.some(r=>r.tod===x)),out=[];for(const d of DOW)for(const x of tods){const c=H[d+'|'+x]||{rev:0,orders:0};out.push({d,x,rev:c.rev,orders:c.orders,name:dowName(d)+' · '+todL(x)})}return out}
function momentum(rows){if(rows.length<2)return null;const a=rows[0].ts,b=rows.at(-1).ts;if(b-a<864e5)return null;const mid=(a+b)/2,m=new Map();
  for(const r of rows){let g=m.get(r.item);if(!g){g={key:r.item,h1:0,h2:0};m.set(r.item,g)}if(r.ts<mid)g.h1+=r.amt;else g.h2+=r.amt}
  return[...m.values()].filter(g=>g.h1>0).map(g=>({...g,chg:(g.h2-g.h1)/g.h1})).sort((x,y)=>y.chg-x.chg)}

function scatter(el,pts,{height=330,xl,yl,fx,fy}){

  g+=`<line x1="${X(ax)}" x2="${X(ax)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" stroke-dasharray="4 4"/><line x1="${m.l}" x2="${W-m.r}" y1="${Y(ay)}" y2="${Y(ay)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;

  g+=cq(t('q_star'),W-m.r-6,m.t+14,'end')+cq(t('q_prem'),m.l+6,m.t+14,'start')+cq(t('q_vol'),W-m.r-6,m.t+ih-8,'end')+cq(t('q_rev'),m.l+6,m.t+ih-8,'start');
  pts.forEach((p,k)=>{p.below=pts.slice(0,k).some(q=>Math.abs(X(q.x)-X(p.x))<80&&Math.abs(Y(q.y)-Y(p.y))<22&&!q.below)});
  g+=pts.map((p,k)=>`<g class="pt" style="animation:fade .6s ${k*90}ms both"><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="11" fill="${p.color}" stroke="var(--solid)" stroke-width="2.5" data-tip="${tipA(p.tip)}" style="cursor:default"/><text x="${X(p.x)+(p.below?16:0)}" y="${Y(p.y)+(p.below?4:-17)}" text-anchor="${p.below?'start':'middle'}" style="font-size:11.5px;font-weight:700;fill:var(--ink)">${p.label}</text></g>`).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg>`;
}

    const top3=K.prods.slice(0,3).reduce((a,g)=>a+g.rev,0)/K.rev,bo=bigOrders(rows),np=rows.filter(r=>!r.pay),npRev=sumBy(np,'amt');
    const days=new Set(rows.map(r=>r.ts)).size;
    const exec=[t('e_rev',{rev:money(K.rev),orders:nf(K.orders),days:nf(days),aov:money(K.aov,1)}),t('e_prod',{p:lv(K.best.key),share:pf(K.best.rev/K.rev),top3:pf(top3)})];
    if(sl.length>1)exec.push(t('e_slot',{s1:best.name,r1:money(best.rev),s2:worst.name,r2:money(worst.rev)}));
    if(K.tr?.rev!=null)exec.push(t('e_growth',{chg:spf(K.tr.rev)}));
    const sc=[{l:'sc_conc',v:pf(top3,1),n:'sc_conc_n'},{l:'sc_growth',v:K.tr?.rev!=null?spf(K.tr.rev):t('ph_none'),n:'sc_growth_n',tone:K.tr?.rev==null?'':K.tr.rev>=0?'good':'bad'},{l:'sc_big',v:pf(bo.share,1),n:'sc_big_n',p:{n:nf(bo.n)}},{l:'sc_nopay',v:pf(np.length/K.orders,1),n:'sc_nopay_n',warn:np.length>0}];
    const MX=matrix(K),MO=momentum(rows);
    // suggestions
    const acts=[];const P=K.prods;
    acts.push({pri:'high',t:t('a_star_t',{p:lv(P[0].key)}),x:t('a_star_x',{p:lv(P[0].key),share:pf(P[0].rev/K.rev)})});
    if(sl.length>2){acts.push({pri:'high',t:t('a_peak_t',{s:best.name}),x:t('a_peak_x',{s:best.name,rev:money(best.rev),mult:nf(best.rev/avgSlot,1)})});
      acts.push({pri:'idea',t:t('a_slow_t',{s:worst.name}),x:t('a_slow_x',{s:worst.name,rev:money(worst.rev),gap:pf(1-worst.rev/avgSlot,0),avg:money(avgSlot)})})}
    if(MO&&MO.length>1){const dn=MO.at(-1),up=MO[0];
      if(dn.chg<0)acts.push({pri:'watch',t:t('a_dec_t',{p:lv(dn.key)}),x:t('a_dec_x',{p:lv(dn.key),chg:spf(dn.chg),r1:money(dn.h1),r2:money(dn.h2)})});
      if(up.chg>0)acts.push({pri:'idea',t:t('a_inc_t',{p:lv(up.key)}),x:t('a_inc_x',{p:lv(up.key),chg:spf(up.chg),r1:money(up.h1),r2:money(up.h2)})})}
    if(P.length>1)acts.push({pri:'watch',t:t('a_low_t',{p:lv(P.at(-1).key)}),x:t('a_low_x',{p:lv(P.at(-1).key),share:pf(P.at(-1).rev/K.rev)})});
    if(MX){const unit=k=>rows.find(r=>r.item===k).price;const pr=MX.filter(g=>g.cls==='prem')[0],vo=MX.filter(g=>g.cls==='vol')[0];
      if(pr)acts.push({pri:'idea',t:t('a_prem_t',{p:lv(pr.key)}),x:t('a_prem_x',{p:lv(pr.key),price:money(unit(pr.key))})});
      if(vo)acts.push({pri:'idea',t:t('a_vol_t',{p:lv(vo.key)}),x:t('a_vol_x',{p:lv(vo.key),price:money(unit(vo.key))})})}
    if(np.length)acts.push({pri:'watch',t:t('a_pay_t'),x:t('a_pay_x',{n:nf(np.length),share:pf(np.length/K.orders),rev:money(npRev)})});
    if(K.orders>=10)acts.push({pri:'idea',t:t('a_big_t'),x:t('a_big_x',{n:nf(bo.n),share:pf(bo.share)})});
    const priL={high:'pri_high',watch:'pri_watch',idea:'pri_idea'},priC={high:'',watch:'low',idea:'gray'};
    let n=0;
    return`<div class="grid stagger">
    ${card({i:n++,cls:'s12',title:t('ins_exec'),sub:t('ins_exec_s'),body:`<div class="tl exec">${exec.map((x,i)=>`<div style="align-items:flex-start"><span class="r">${nf(i+1)}</span><span style="font-size:15px;line-height:1.6">${x}</span></div>`).join('')}</div>`})}
    ${sc.map(c=>`<div class="card stat s3 half sc ${c.warn?'warnb':''}" style="--i:${n++};padding:16px 18px"><span style="font-weight:600;color:var(--ink2)">${t(c.l)}</span><b class="${c.tone||''}" style="font-size:34px">${c.v}</b><span>${t(c.n,c.p)}</span></div>`).join('')}
    ${MX?card({i:n++,cls:'s7',title:t('q_title'),sub:t('q_sub'),body:'<div class="chart" id="c-q"></div>'}):''}
    ${MX?card({i:n++,cls:'s5',title:t('q_title'),body:`<div class="tl">${['star','prem','vol','rev'].map(c=>{const l=MX.filter(g=>g.cls===c);return`<div style="align-items:flex-start;flex-direction:column;gap:4px"><span><span class="badge ${c==='star'?'':c==='rev'?'low':'gray'}">${t('q_'+c)}</span> <small style="color:var(--muted)">${t('q_'+c+'_d')}</small></span><span style="font-weight:600">${l.length?l.map(g=>`<i class="sw" style="background:${colorOf('item',g.key)}"></i>${lv(g.key)}`).join('&nbsp;&nbsp; '):'<span style="color:var(--muted);font-weight:400">'+t('ph_none')+'</span>'}</span></div>`}).join('')}</div>`}):''}
    ${MO?card({i:n++,cls:'s7',title:t('m_title'),sub:t('m_sub'),body:`<div id="c-mo">${MO.map((g,k)=>`<div class="hb" style="--k:${k};grid-template-columns:minmax(78px,130px) 1fr auto" data-tip="${tipA(`<b>${lv(g.key)}</b><div>${money(g.h1)} → ${money(g.h2)}</div>`)}"><div class="n"><i style="background:${colorOf('item',g.key)}"></i><span>${lv(g.key)}</span></div><div class="t"><i style="--w:${Math.min(100,Math.abs(g.chg)/Math.max(...MO.map(x=>Math.abs(x.chg)))*100)}%;background:${g.chg>=0?'var(--good)':'var(--bad)'}"></i></div><div class="v" style="min-width:86px"><span class="tr ${g.chg>=0?'up':'dn'}">${ic(g.chg>=0?'up':'down')}${pf(Math.abs(g.chg))}</span></div></div>`).join('')}</div>`}):''}
    ${sl.length>2?card({i:n++,cls:MO?'s5':'s12',title:t('s_title'),sub:t('s_sub',{avg:money(avgSlot)}),body:`<div class="tl"><div style="color:var(--muted);font-size:12px;font-weight:700">${t('s_best')}</div>${sorted.slice(0,3).map(x=>`<div><span>${x.name}</span><span style="color:var(--muted)">${pf(x.rev/avgSlot-1)}</span><b>${money(x.rev)}</b></div>`).join('')}<div style="color:var(--muted);font-size:12px;font-weight:700;margin-top:8px">${t('s_worst')}</div>${sorted.slice(-3).reverse().map(x=>`<div><span>${x.name}</span><span style="color:var(--muted)">${pf(x.rev/avgSlot-1)}</span><b>${money(x.rev)}</b></div>`).join('')}</div>`}):''}
    ${card({i:n++,cls:'s12',title:t('a_title'),sub:t('a_sub'),body:`<div class="acts">${acts.map(a=>`<div class="act"><span class="badge ${priC[a.pri]}">${t(priL[a.pri])}</span><h4>${a.t}</h4><p>${a.x}</p></div>`).join('')}</div>`})}
    <div class="s12" style="--i:${n++};margin-top:6px"><h2 style="font-size:20px">${t('det_title')}</h2><p style="color:var(--muted)">${t('ins_s')}</p></div>
    ${ins.map((x,i)=>`<div class="card ins s6" style="--i:${n+i}"><div class="ic">${ic(x.icn)}</div><div><h4>${x.title}</h4><p>${x.txt}</p></div></div>`).join('')}
    ${card({i:n+ins.length,cls:'s12',title:t('dq_t'),sub:t('dq_s'),body:`<div class="dq">
      <div><b>${nf(dq.rows)}</b><span>${t('dq_rows')}</span></div>
      <div><b>${nf(dq.dupRows)}</b><span>${t('dq_dups')}</span></div>
      <div><b>${nf(dq.dupIds)}</b><span>${t('dq_dupid')}</span></div>
      <div class="${dq.missingPay?'warn':''}"><b>${nf(dq.missingPay)}</b><span>${t('dq_pay')} · ${t('dq_pay_n')}</span></div>
      <div><b>${nf(dq.slash+dq.dash)}</b><span>${t('dq_dates')} · ${t('dq_dates_n',{a:nf(dq.slash),b:nf(dq.dash),r:mName(dq.min)+' → '+mName(dq.max)})}</span></div>
      <div><b>${nf(dq.mismatch)}</b><span>${t('dq_mis')}</span></div>
      <div><b>${nf(dq.invalid)}</b><span>${t('dq_inv')}</span></div>
      <div><b>${nf(dq.days)}</b><span>${t('dq_days')} · ${t('dq_days_n',{n:nf(dq.span)})}</span></div>
      <div class="warn"><b>${t('dq_tod')}</b><span>${t('dq_tod_n')}</span></div>
      <div><b>${dFull(dq.min)} → ${dFull(dq.max)}</b><span>${t('dq_range')}</span></div></div>`})}</div>`},
  draw(rows){const K=kpis(rows),MX=matrix(K);if(!MX)return;
    const unit=k=>rows.find(r=>r.item===k).price;
    scatter($('#c-q'),MX.map(g=>({x:g.qty,y:g.rev,color:colorOf('item',g.key),label:lv(g.key),tip:`<b>${lv(g.key)}</b>${tipRow(colorOf('item',g.key),t('qty'),nf(g.qty))}${tipRow(colorOf('item',g.key),t('revenue'),money(g.rev))}<div>${t('th_price')}: <b style="display:inline">${money(unit(g.key))}</b></div><div>${t('q_'+g.cls)}</div>`})),{xl:t('q_x'),yl:t('q_y')});
  }};
/* ============================================================
   7. SHELL: sidebar, header, filters
   ============================================================ */
const DIMS=[['item','f_item'],['type','f_type'],['pay','f_pay'],['recv','f_recv'],['tod','f_tod']];
const optLabel=(k,v)=>k==='tod'?todL(v):lv(v);
const activeCount=()=>DIMS.filter(([k])=>S.f[k].length).length+(S.f.from||S.f.to?1:0);
function shell(){
  const nav=PAGES.map(p=>`<a href="#${p}" data-page="${p}" class="${S.page===p?'on':''}" ${S.page===p?'aria-current="page"':''} title="${t('nav_'+p)}">${ic(p)}<span class="lbl">${t('nav_'+p)}</span></a>`).join('');
  $('#app').className=S.collapsed?'collapsed':'';
  $('#app').innerHTML=`<aside class="side"><div class="brand"><div class="logo">${LOGO}</div><div><b>${t('brand')}</b><small>${t('brand_sub')}</small></div></div><nav class="nav" aria-label="Main">${nav}</nav><div class="grow"></div>
  <div class="foot"><button class="collapse-btn" id="collapse" aria-label="${S.collapsed?t('expand'):t('collapse')}">${ic('panel')}<span class="lbl">${S.collapsed?t('expand'):t('collapse')}</span></button></div></aside>
  <div class="main"><header class="top"><div class="top-in"><div class="tt"><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
   <label class="sbox">${ic('search')}<input id="gs" type="search" placeholder="${t('search_ph')}" aria-label="${t('search_ph')}"></label>
   <button class="ib" id="refresh" title="${t('refresh')}" aria-label="${t('refresh')}">${ic('refresh')}</button>
   <button class="ib" id="theme" title="${S.theme==='dark'?t('theme_light'):t('theme_dark')}" aria-label="${S.theme==='dark'?t('theme_light'):t('theme_dark')}">${ic(S.theme==='dark'?'sun':'moon')}</button>
   <button class="ib" id="lang" title="${t('lang_switch')}" aria-label="${t('lang_switch')}">${ic('globe')}<span>${S.lang==='en'?'🇸🇦 العربية':'🇬🇧 English'}</span></button>
   <div class="pop-wrap"><button class="ib" id="set-b" title="${t('settings')}" aria-label="${t('settings')}" aria-expanded="${S.open==='set'}">${ic('settings')}</button><div id="set-p"></div></div></div>
   <div id="fbar"></div></header><main class="content" id="view" tabindex="-1"></main></div>
   <nav class="bnav" aria-label="Main">${PAGES.map(p=>`<a href="#${p}" data-page="${p}" class="${S.page===p?'on':''}">${ic(p)}<span>${t('nav_'+p)}</span></a>`).join('')}</nav>`;
  drawSettings();
}
function drawSettings(){const el=$('#set-p');if(!el)return;el.innerHTML=S.open==='set'?`<div class="pop"><h4>${t('currency')}</h4><select id="cur">${[['',t('cur_none')],['₹','₹'],['$','$'],['€','€'],['£','£'],['EGP','EGP'],['SAR','SAR']].map(([v,l])=>`<option value="${v}" ${v===S.cur?'selected':''}>${l}</option>`).join('')}</select><p>${t('cur_note')}</p></div>`:''}
function fbar(){
  const n=activeCount();
  const ms=DIMS.map(([k,lab])=>{const sel=S.f[k];return`<div class="ms"><button data-ms="${k}" class="${sel.length?'act':''}" aria-expanded="${S.open===k}">${t(lab)}${sel.length?`<span class="n">${nf(sel.length)}</span>`:''}${ic('chev')}</button>${S.open===k?`<div class="pop">${D.facets[k].map(v=>{const c=D.rows.filter(r=>r[FKEY[k]]===v).length;return`<label class="opt"><input type="checkbox" data-opt="${k}" value="${esc(v)}" ${sel.includes(v)?'checked':''}>${k==='item'||k==='type'||k==='pay'?`<i style="background:${colorOf(k,v)}"></i>`:''}${optLabel(k,v)}<em>${nf(c)}</em></label>`}).join('')}</div>`:''}</div>`}).join('');
  const chips=[];if(S.f.from||S.f.to)chips.push(['date',`${t('f_from')} ${S.f.from?dFull(Date.parse(S.f.from)):'…'} ${t('f_to')} ${S.f.to?dFull(Date.parse(S.f.to)):'…'}`]);
  DIMS.forEach(([k,lab])=>S.f[k].forEach(v=>chips.push([k+'|'+v,`${t(lab)}: ${optLabel(k,v)}`])));
  $('#fbar').innerHTML=`<div class="fbar"><button class="ib ftoggle" id="ftog">${ic('filter')}<span>${t('f_filters')}</span>${n?`<span class="chip" style="padding:0 8px">${nf(n)}</span>`:''}</button>
   <div class="fset ${S.fOpen?'open':''}"><span class="dt">${t('f_from')}<input type="date" id="f-from" value="${S.f.from}" min="${new Date(D.dq.min).toISOString().slice(0,10)}" max="${new Date(D.dq.max).toISOString().slice(0,10)}" aria-label="${t('f_from')}"></span><span class="dt">${t('f_to')}<input type="date" id="f-to" value="${S.f.to}" min="${new Date(D.dq.min).toISOString().slice(0,10)}" max="${new Date(D.dq.max).toISOString().slice(0,10)}" aria-label="${t('f_to')}"></span>${ms}${n?`<button class="link" id="fclear">${t('f_clear')}</button>`:''}</div></div>
   ${chips.length?`<div class="chips">${chips.map(([k,l])=>`<span class="chip">${l}<button data-rm="${esc(k)}" aria-label="${t('f_clear')}">${ic('x')}</button></span>`).join('')}</div>`:''}`;
}

/* ============================================================
   8. RENDER LOOP
   ============================================================ */
const prevVals={};let curRows=[],navAnim=true;
function animateCounts(){
  $$('[data-count]').forEach(el=>{const to=+el.dataset.count,kind=el.dataset.kind,id=el.dataset.id;const from=prevVals[id]??0;prevVals[id]=to;
    const fmt=v=>kind==='money'?money(v):kind==='money2'?money(v,1):kind==='spct'?spf(v):nf(v);
    if(!isFinite(to)){el.textContent=t('ph_none');return}
    if(matchMedia('(prefers-reduced-motion:reduce)').matches||from===to){el.textContent=fmt(to);return}
    const t0=performance.now(),dur=900;const step=n=>{const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1&&el.isConnected)requestAnimationFrame(step)};requestAnimationFrame(step)});
}
function emptyState(){return`<div class="card empty">${ic('products')}<h3>${t('empty_t')}</h3><p>${t('empty_p')}</p><button class="btn" id="fclear2">${t('f_clear')}</button></div>`}
function render(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.documentElement.dataset.theme=S.theme;
  curRows=M(D.rows,'f'+JSON.stringify(S.f),()=>filterRows(D.rows,S.f));
  $('#ttl').textContent=t('nav_'+S.page);
  $('#sub').textContent=curRows.length?`${t('orders_n',{n:nf(curRows.length)})} · ${t('range',{a:dFull(curRows[0].ts),b:dFull(curRows.at(-1).ts)})}`:t('orders_n',{n:nf(0)});
  const view=$('#view');
  if(!curRows.length){view.innerHTML=emptyState();return}
  const pg=Page[S.page];view.innerHTML=`<div class="page ${navAnim?'':'noanim'}">${pg.render(curRows)}</div>`;
  if(!navAnim)$$('.stagger>*',view).forEach(e=>e.style.animation='none');
  navAnim=false;pg.draw(curRows);animateCounts();
}
function renderAll(){shell();fbar();render()}
function go(p){if(!PAGES.includes(p))p='overview';S.page=p;S.open=null;navAnim=true;$$('[data-page]').forEach(a=>{a.classList.toggle('on',a.dataset.page===p);p===a.dataset.page?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});fbar();render();scrollTo({top:0})}
function setF(fn){fn(S.f);S.ex.page=1;fbar();render()}

/* events (delegated) */
document.addEventListener('click',e=>{
  const tg=e.target.closest.bind(e.target);let el;
  if(tg('#theme')){S.theme=S.theme==='dark'?'light':'dark';store.set('ff.theme',S.theme);document.documentElement.dataset.theme=S.theme;shell();fbar();render();return}
  if(tg('#lang')){S.lang=S.lang==='en'?'ar':'en';store.set('ff.lang',S.lang);navAnim=false;renderAll();return}
  if(tg('#collapse')){S.collapsed=!S.collapsed;store.set('ff.col',S.collapsed?'1':'0');$('#app').className=S.collapsed?'collapsed':'';const b=$('#collapse');b.querySelector('.lbl').textContent=S.collapsed?t('expand'):t('collapse');setTimeout(()=>{navAnim=false;render()},320);return}
  if(tg('#refresh')){const b=$('#refresh');b.classList.add('spin');D=loadData();for(const k in _memo)0;navAnim=true;fbar();render();setTimeout(()=>b.classList.remove('spin'),700);return}
  if(tg('#set-b')){S.open=S.open==='set'?null:'set';drawSettings();$('#set-b').setAttribute('aria-expanded',S.open==='set');return}
  if(tg('#ftog')){S.fOpen=!S.fOpen;fbar();return}
  if(tg('#fclear')||tg('#fclear2')){S.f={from:'',to:'',item:[],type:[],pay:[],recv:[],tod:[]};S.open=null;S.ex.page=1;fbar();render();return}
  if(el=tg('[data-rm]')){const k=el.dataset.rm;setF(f=>{if(k==='date'){f.from='';f.to=''}else{const[d,v]=k.split('|');f[d]=f[d].filter(x=>x!==v)}});return}
  if(el=tg('[data-ms]')){const k=el.dataset.ms;S.open=S.open===k?null:k;fbar();return}
  if(el=tg('[data-seg]')){S.ui[el.dataset.seg]=el.dataset.v;navAnim=false;render();return}
  if(el=tg('[data-sort]')){const k=el.dataset.sort;if(S.ex.sort===k)S.ex.dir*=-1;else{S.ex.sort=k;S.ex.dir=1}$('#ex-body').innerHTML=exBody(curRows);return}
  if(el=tg('[data-pg]')){S.ex.page=+el.dataset.pg;$('#ex-body').innerHTML=exBody(curRows);return}
  if(tg('#ex-exp')){exportCSV(curRows);return}
  if(tg('#ex-cols-b')){S.open=S.open==='cols'?null:'cols';navAnim=false;render();return}
  if(el=tg('[data-page]')){e.preventDefault();go(el.dataset.page);try{history.replaceState(null,'','#'+el.dataset.page)}catch(_){}return}
  if(!tg('.pop')&&!tg('.ms')&&S.open){S.open=null;fbar();drawSettings();if(S.page==='explorer'){navAnim=false;render()}}
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='f-from')setF(f=>f.from=el.value);else if(el.id==='f-to')setF(f=>f.to=el.value);
  else if(el.dataset.opt){const k=el.dataset.opt,v=el.value;setF(f=>{f[k]=el.checked?[...f[k],v]:f[k].filter(x=>x!==v)})}
  else if(el.id==='cur'){S.cur=el.value;store.set('ff.cur',S.cur);navAnim=false;render()}
  else if(el.id==='ex-size'){S.ex.size=+el.value;S.ex.page=1;$('#ex-body').innerHTML=exBody(curRows)}
  else if(el.dataset.col){S.ex.cols[el.dataset.col]=el.checked?1:0;$('#ex-body').innerHTML=exBody(curRows)}
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='ex-q'){S.ex.q=el.value;S.ex.page=1;$('#ex-body').innerHTML=exBody(curRows)}
  else if(el.id==='gs'){S.ex.q=el.value;S.ex.page=1;if(S.page!=='explorer'){if(el.value){go('explorer');try{history.replaceState(null,'','#explorer')}catch(_){}setTimeout(()=>{const q=$('#ex-q');if(q)q.focus()},60)}}else{const q=$('#ex-q');if(q){q.value=el.value;$('#ex-body').innerHTML=exBody(curRows)}}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.open){S.open=null;fbar();drawSettings()}});
addEventListener('hashchange',()=>go(location.hash.slice(1)));
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(curRows.length&&$('#view')){navAnim=false;Page[S.page].draw(curRows)}},150)});

/* ============================================================
   9. BOOT
   ============================================================ */
function boot(){
  try{
    D=loadData();S.page=PAGES.includes(location.hash.slice(1))?location.hash.slice(1):'overview';
    document.documentElement.dataset.theme=S.theme;
    shell();fbar();render();
  }catch(err){
    console.error(err);$('#app').innerHTML=`<div class="content"><div class="card empty">${ic('x')}<h3>${t('err_t')}</h3><p>${t('err_p')}</p><p style="font-size:12px">${esc(err.message)}</p></div></div>`;
  }
  const l=$('#load');l.style.opacity=0;setTimeout(()=>l.remove(),400);
}
boot();
</script>
</body>
